# Supervised learning parameters
interval: 4
batch_size: 16 # Consider adjusting this (e.g., lower to 16 or 8) based on GPU memory and training stability for a small dataset.
dropout: 0.2
dropout3d: 0.2
epochs: 30 # For a mini-dataset, you might need more epochs to converge, or fewer if it overfits quickly. Monitor validation loss.
t_max: 30
patience: 15 # Good for early stopping, helps prevent overfitting on small datasets.
lr: 0.001 # This might be a bit high for a small dataset. Consider trying 0.001 or 0.0001 if training is unstable.
eta_min: 0.001
diff_lr_rgb: False
diff_lr_flow: False
mixed_precision: True
coclr: False

